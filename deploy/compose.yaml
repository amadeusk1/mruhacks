services:
  game:
    image: debian:12-slim
    restart: unless-stopped
    working_dir: /game
    entrypoint: ["/game/pengloo.x86_64", "--headless", "--", "--net-host", "--net-ws", "--net-port=7778", "--net-name=Server", "--dedicated"]
    volumes:
      - ./server:/game:ro
      - ../../data:/home/game
    environment:
      HOME: /home/game
    user: "1000:1000"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 2g
    cpus: 2
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on: [game]
    ports: ["18085:80"]
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
