services:
  game:
    image: debian:12-slim
    restart: unless-stopped
    working_dir: /game
    # --max-players: the official island's cap (a full server shows the Servers list + "host your own").
    # --public lists it in the lobby for its player count; players still connect via /multiplayer.
    entrypoint: ["/game/pengloo.x86_64", "--headless", "--", "--net-host", "--net-ws", "--net-port=7778", "--net-name=Server", "--dedicated",
      "--max-players=40", "--public", "--server-name=Pengloo Party"]
    volumes:
      - ./server:/game:ro
      - ../../data:/home/game
    env_file:
      - path: ../../secrets/game.env   # PENGLOO_HOST_TOKEN (official listing) + PENGLOO_ADMIN_CODE (full-server bypass)
        required: false
    environment:
      HOME: /home/game
      PENGLOO_LOBBY_BASE: http://lobby:8096
    user: "1000:1000"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 2g
    cpus: 2
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on: [game, cinema, lobby]
    ports: ["18085:80"]
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../downloads:/usr/share/nginx/html/download:ro   # desktop builds persist across releases (web/download/ must exist as the mountpoint)
    mem_limit: 128m
  cinema:
    build: ./cinema            # services/cinema from the same commit (Go gateway + ffmpeg)
    image: pengloo-cinema:local
    restart: unless-stopped
    env_file: ../../secrets/cinema.env   # Emby key + invite codes; kept outside releases and git
    environment:
      CINEMA_LISTEN: 0.0.0.0:8095
      CINEMA_ORIGIN: https://pengloo.party
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 1g
    cpus: 2
  lobby:
    build: ./lobby             # services/lobby from the same commit (community-server list + relay)
    image: pengloo-lobby:local
    restart: unless-stopped
    env_file:
      - path: ../../secrets/lobby.env   # LOBBY_OFFICIAL_IDS (and optional LOBBY_BANNED_IDS / caps)
        required: false
    environment:
      LOBBY_LISTEN: 0.0.0.0:8096
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 256m
    cpus: 1
