# Real player address for the cinema login throttle: Cloudflare's CF-Connecting-IP, else the socket.
map $http_cf_connecting_ip $pengloo_client_ip {
 "" $remote_addr;
 default $http_cf_connecting_ip;
}
server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 gzip_static on;
 gzip on;
 gzip_types application/wasm application/octet-stream application/javascript text/css;
 gzip_min_length 1024;
 add_header X-Content-Type-Options nosniff always;
 location / { try_files $uri $uri/ =404; }
 location = /health { access_log off; return 200 'pengloo-web\n'; }
 location /cinema/ {
  proxy_pass http://cinema:8095;   # path preserved; same origin keeps cookies and Origin checks working
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP $pengloo_client_ip;   # overwrites anything the browser sent
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Range $http_range;
  proxy_buffering off;             # SSE (/cinema/events) and streamed segments
  proxy_request_buffering off;
  proxy_cache off;
  gzip off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  client_max_body_size 1m;
 }
 location = /multiplayer {
  proxy_pass http://game:7778;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_buffering off;
 }

}
