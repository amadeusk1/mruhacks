<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pengloo Cinema</title><link rel="stylesheet" href="/cinema/style.css"><script defer src="/cinema/hls.min.js"></script><script defer src="/cinema/player.js"></script></head><body>
<header><div><span class="eyebrow">PENGLOO</span><h1>Movie night</h1></div><button id="leave">Return to town</button></header><p id="status" role="status">Connecting to the cinema…</p>
<section id="login" hidden><h2>Join from your game</h2><p>Enter the cinema and choose a seat or the movie kiosk. Your lobby connects you automatically.</p></section>
<main id="room" hidden><div id="toolbar"><span id="role"></span><button id="claim" hidden>Take the remote</button><button id="browse">Choose a movie</button></div><section id="library"><form id="search-form"><input id="search" type="search" placeholder="Search the library" aria-label="Search library"><button>Search</button></form><div id="titles"></div></section><section id="watch" hidden><h2 id="title"></h2><div id="video-wrap"><video id="video" playsinline preload="auto"></video><button id="enable" hidden>Click to enable movie audio</button></div><div id="controls"><button id="play">Play</button><button id="pause">Pause</button><input id="seek" type="range" min="0" step="1" value="0" aria-label="Movie position"><span id="time">0:00</span><label>Movie volume <input id="volume" type="range" min="0" max="1" step="0.05" value="0.7"></label><button id="fullscreen">Full screen</button></div><p class="hint">The remote controls everyone's playback. Volume changes only yours. Your game and voice connection stay active.</p></section></main></body></html>
