<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #071a26;
      }
    </style>
  </head>
  <body>
    <!--
      9.1 s launch trailer of real game footage. Cuts sit on beats of the song (172 BPM),
      floored to the frame at 30 fps: the five slide-6 penguins jump out of their cards into the
      game (Flow, frames-to-video), walk the plaza together (tools/film_walk.gd), then the logo
      zooms out with game frames inside it and lands on dark. Filmed features join after the walk.
    -->
    <div data-hf-id="hf-at0g"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="9.1"
      data-width="1920"
      data-height="1080"
    >
      <video data-hf-id="hf-intr"
        id="intro"
        class="clip"
        src="assets/flow-intro.mp4"
        data-start="0"
        data-duration="2.76667"
        data-track-index="1"
        muted
      ></video>

      <video data-hf-id="hf-walk"
        id="walk"
        class="clip"
        src="assets/walk.mp4"
        data-start="2.76667"
        data-duration="2.8"
        data-track-index="1"
        muted
      ></video>

      <div data-hf-id="hf-guyk"
        id="logo"
        data-composition-id="logo"
        data-composition-src="compositions/logo.html"
        data-start="5.56667"
        data-duration="3.53333"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <audio data-hf-id="hf-z213"
        id="song"
        class="clip"
        src="assets/song.m4a"
        data-start="0"
        data-duration="9.1"
        data-track-index="2"
        data-volume="1"
      ></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
